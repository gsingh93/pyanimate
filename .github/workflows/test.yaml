name: Unit tests
on: [push, pull_request]

jobs:
  tests:
    strategy:
      fail-fast: false
    runs-on: [ubuntu-22.04, ubuntu-24.04]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Run image
        uses: abatilo/actions-poetry@v3
        with:
          poetry-version: main

      - name: Install dependencies
        run: poetry install --with dev

      - name: Run tests
        run: |
          ./test.sh

      - name: Upload coverage to Codecov
        if: success() || failure()
        uses: codecov/codecov-action@v3

      - name: Run examples
        run: |
          ./examples/animate.py --width 1080 --height 720 -f 5 --no-show
          ./examples/bitfield-diagram.py --relative --no-show
